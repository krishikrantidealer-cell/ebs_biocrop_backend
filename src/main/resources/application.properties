# Application Configuration
spring.application.name=ebs_biocrop_web
server.port=8080
server.forward-headers-strategy=framework

# Local developer settings are loaded from the git-ignored .env file.
spring.config.import=optional:file:.env[.properties]

# MongoDB Atlas connection is provided through MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:seller_hub}

# JWT HMAC-SHA256 signing key is provided through JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OTP Configuration
app.otp.length=6
app.otp.expiration-minutes=5
app.otp.cooldown-seconds=60
app.otp.max-attempts=3
app.otp.console-delivery.enabled=${OTP_CONSOLE_DELIVERY_ENABLED:false}
app.otp.master-otp=${MASTER_OTP:123456}
app.otp.master-otp.enabled=${MASTER_OTP_ENABLED:true}

# Airtel IQ SMS Configuration
app.sms.airtel-iq.enabled=${AIRTEL_IQ_ENABLED:true}
app.sms.airtel-iq.url=${AIRTEL_IQ_URL:https://iqsms.airtel.in/api/v1/send-sms}
app.sms.airtel-iq.customer-id=${AIRTEL_IQ_CUSTOMER_ID:60bcc9cf-5bbe-40f5-a5ea-f8cc875bc1ea}
app.sms.airtel-iq.username=${AIRTEL_IQ_USERNAME:3e6ecb5e_f47d_482a_bd24_226521e128cf}
app.sms.airtel-iq.password=${AIRTEL_IQ_PASSWORD:4lC0T2bLD4}
app.sms.airtel-iq.source-address=${AIRTEL_IQ_SOURCE_ADDRESS:KRORCS}
app.sms.airtel-iq.dlt-template-id=${AIRTEL_IQ_DLT_TEMPLATE_ID:1007069945111743122}
app.sms.airtel-iq.entity-id=${AIRTEL_IQ_ENTITY_ID:1001392915934347308}
app.sms.airtel-iq.message-template=${AIRTEL_IQ_MESSAGE_TEMPLATE:{otp} is your login OTP for Krishikranti Organics. This OTP is valid for 10 minutes. Do not share this OTP with anyone.}
app.sms.airtel-iq.test-numbers=${AIRTEL_IQ_TEST_NUMBERS:9999999999}

# Razorpay Payment Gateway Configuration
app.razorpay.enabled=${RAZORPAY_ENABLED:true}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_ebs_biocrop_default}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:ebs_biocrop_secret_default_2026}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:ebs_biocrop_webhook_secret_2026}

# Shiprocket Logistics & Courier Configuration
app.shiprocket.enabled=${SHIPROCKET_ENABLED:true}
app.shiprocket.url=${SHIPROCKET_URL:https://apiv2.shiprocket.in/v1/external}
app.shiprocket.email=${SHIPROCKET_EMAIL:shipping@ebsbiocrop.com}
app.shiprocket.password=${SHIPROCKET_PASSWORD:ebs_shiprocket_secret_2026}
app.shiprocket.pickup-location=${SHIPROCKET_PICKUP_LOCATION:Primary}
app.shiprocket.pickup-pincode=${SHIPROCKET_PICKUP_PINCODE:132001}
app.mail.console-delivery.enabled=${MAIL_CONSOLE_DELIVERY_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@ebsbiocrop.com}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.password-reset.expiration-minutes=30

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Configure exact trusted frontend origins as a comma-separated environment value.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000,http://localhost:8080,https://ebskrishidukaan.com,https://www.ebskrishidukaan.com}

# Logging
logging.level.com.ebs.biocrop=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
app.redis.key-hmac-secret=${REDIS_KEY_HMAC_SECRET:}

# In-memory rate limiting fallbacks are opt-in; Redis is required by default.
app.rate-limit.in-memory-fallback=${RATE_LIMIT_IN_MEMORY_FALLBACK:false}
app.rate-limit.dev-in-memory-fallback=${RATE_LIMIT_DEV_IN_MEMORY_FALLBACK:false}

# Legacy data migration remains opt-in; no product or category spreadsheet is read at startup.
app.database.legacy-migration.enabled=false
app.database.category-migration.enabled=false
app.database.schema-migration.enabled=false
app.database.maintenance-mode.enabled=false

# OpenAPI and Swagger UI stay available during development; deployments can disable them with OPENAPI_ENABLED=false.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}

# Google Cloud Storage configuration
app.gcs.bucket-name=${GCS_BUCKET_NAME:sellerhub-prod-media-us}
app.gcs.review-bucket-name=${GCS_REVIEW_BUCKET_NAME:sellerhub-products-reviews-media-us}
app.gcs.sellerdata-bucket-name=${GCS_SELLERDATA_BUCKET_NAME:sellerhub-prod-sellerdata-media-us}
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=110MB