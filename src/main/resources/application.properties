# Application Configuration
spring.application.name=ebs_biocrop_web
server.port=8080

# Local developer settings are loaded from the git-ignored .env file.
spring.config.import=optional:file:.env[.properties]

# MongoDB Atlas connection is provided through MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=seller_hub

# JWT HMAC-SHA256 signing key is provided through JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# OTP Configuration
app.otp.length=6
app.otp.expiration-minutes=5
app.otp.cooldown-seconds=60
app.otp.max-attempts=3
app.otp.console-delivery.enabled=${OTP_CONSOLE_DELIVERY_ENABLED:false}

# Configure exact trusted frontend origins as a comma-separated environment value.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Logging
logging.level.com.ebs.biocrop=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}


# Data Seeder Configuration
app.seed-data=false
app.database.legacy-migration.enabled=false

# Category taxonomy seeding is explicit and skipped when the collection already has documents.
app.seed-categories=true

